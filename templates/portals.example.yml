# -- Company aliases (optional) --
# Map alternate company names to a single canonical label so the scanner's
# company+role dedup matches your tracker. The scanner keys dedup on the name a
# provider returns — usually the ATS org (e.g. Greenhouse "Intercom") — which
# may differ from the brand you track (e.g. "Fin"). Without an alias, the same
# role is re-scanned and re-evaluated every run because "intercom::role" never
# matches "fin::role" in data/applications.md.
#
# Format: `CanonicalName: [alias, ...]`. Every alias AND the canonical name
# resolve to the canonical label (case-insensitive). Companies with no entry are
# unaffected. Combined with title normalization, this suppresses URL-new
# duplicates caused by requisition URL changes and per-location title splits
# ("Engineer (Berlin)" vs "Engineer"). It does not classify repost patterns or
# produce `postingChurn` evidence; detect-reposts.mjs and company-history.mjs own
# that post-tracking layer.
#
# company_aliases:
#   Fin: [Intercom]

# ── aggregator: true (optional, per entry) ────────────────────────────
# Marks a tracked_companies entry as a MULTI-EMPLOYER BOARD rather than one
# employer — a job platform, a VC portfolio board, a recruiting marketplace that
# posts partner companies' roles under its own ATS account.
#
# Everything in the post-tracking layer assumes "same company + same title = the
# same opening". On such a board that assumption is false: two identical titles
# are two different employers' jobs. detect-reposts.mjs therefore skips flagged
# companies entirely, and company-history.mjs reports
# `postingChurn: aggregator-not-evaluated` for them — deliberately NOT
# `none-detected`, which would claim a clean result from a check that never ran.
#
# It has to be config rather than something inferred: measured on a real
# scan-history, an aggregator's clusters are indistinguishable by shape from
# legitimate ones (both around 2 sightings over 2 dates). See #2703.
#
# Scanning is unaffected — the postings are real and worth finding. Only the
# repost inference over them is meaningless. Companies with no flag are
# untouched, so leaving this out changes nothing.
#
#   - name: SomeBoard
#     careers_url: https://jobs.lever.co/someboard
#     provider: lever
#     aggregator: true

