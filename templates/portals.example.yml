# Portal Scanner Configuration
# Used by /career-ops scan to discover new offers automatically.
#
# Strategy (4 levels):
#   0. Local parser → per-company `parser:` script for SSR/static career pages (zero-token)
#   1. Playwright → careers_url of each company (real-time, reliable)
#   2. HTTP JSON (WebFetch) → per-company `api:` on tracked_companies (see board_api_catalog below)
#   3. WebSearch with site: filters (broad discovery, may be stale)
#
# IMPORTANT: Each company in tracked_companies MUST have careers_url.
#   Prefer the BRANDED company careers URL whenever available; use ATS-hosted URL only as fallback.
#   ✅ https://careers.mastercard.com   ⚠️ https://mastercard.wd1.myworkdayjobs.com (fallback only)
#   ✅ https://openai.com/careers       ⚠️ https://job-boards.greenhouse.io/openai (fallback only)
#   Exception: ATS-hosted careers_url is acceptable when no branded careers page exists.
#   Using raw ATS URLs when a branded page exists can cause false 410 errors (job ID mismatch).
#
# HOW TO CUSTOMIZE:
#   1. Copy this file to portals.yml in the project root
#   2. Edit title_filter.positive with YOUR target role keywords
#   3. Add/remove companies in tracked_companies
#   4. Adjust search_queries for your preferred job boards
#   5. Set enabled: false on companies you don't care about

# -- Scan history recheck policy (optional) --
# By default, URLs recorded in data/scan-history.tsv are deduped forever.
# Set recheck_after_days to let previously added URLs become eligible again
# after N days, useful for roles that reopen or are republished at the same URL.
# Permanent invalid statuses such as blocked host or malformed URL still remain
# deduped forever.
#
# scan_history:
#   recheck_after_days: 30

# -- Interamt.de searches (optional, German public sector) --
# Read by scan-interamt.mjs (`npm run scan:interamt`), a separate Playwright
# scanner for Interamt.de, a portal for German federal, state, and municipal
# government job postings. Interamt has no REST API (Apache Wicket, stateful),
# so it isn't reachable through the tracked_companies providers above;
# scan-interamt.mjs drives a real browser session instead.
#
# Each `was:` entry is a search keyword submitted to Interamt's search form.
# If this block is absent, scan-interamt.mjs falls back to a generic set of
# German IT keywords (Informatiker, Softwareentwickler, IT-Spezialist, ...).
# Results are still filtered by title_filter/location_filter below.
#
# interamt_searches:
#   - was: "Softwareentwickler"
#   - was: "Informatiker"
#   - was: "Datenanalyst"
#   - was: "Systemadministrator"

# -- Location filter (optional) --
# Filter scanned jobs by location. Applied AFTER title filter, BEFORE dedup.
# If this entire block is absent, all locations pass (current default behavior).
#
# Semantics (case-insensitive substring, in this order):
#   - Empty location string on a job → pass (don't penalize missing data)
#   - Any `block_hard` keyword present → reject (always_allow cannot override it)
#   - Any `always_allow` keyword present → pass (takes precedence over `block`)
#   - Any `block` keyword present → reject
#   - `allow` empty → pass (already cleared block)
#   - `allow` non-empty → must match at least one keyword
#
# `always_allow` is optional. It rescues multi-location postings that name your
# home region: with always_allow ["New York"] and block ["India"], a job listed
# "Remote, New York or India" passes (New York wins), while "Remote, India" is
# still rejected. Omit always_allow entirely and the filter behaves as before.
#
# `block_hard` is optional too, and is the one tier always_allow cannot override.
# Use it for country-level terms that are never a false rejection for you. It
# exists because a city name can be a whole word inside a location on another
# continent: with always_allow ["Porto"], the string "Porto Alegre, Brazil"
# passes and your own block ["Brazil"] is never consulted. Word-boundary
# matching does not help — both are genuine whole words. Putting "Brazil" in
# block_hard fixes that without touching the multi-location rescue above.
# Do NOT copy your whole `block` list here: a city in block_hard would kill
# "Stockholm or London" postings, which is exactly what always_allow prevents.
#
# Example below targets US-based remote + a couple of US metros, blocking
# common foreign hubs. Customize to your geography.

# location_filter:
#   # always_allow is checked BEFORE block — keep this list to your home region only
#   always_allow:
#     - "United States"   # also admits City, ST homonyms (Dublin, OH) via USPS states
#     - "New York"
#   allow:
#     - "Remote"
#     - "United States"
#     - "USA"
#     - "Atlanta"
#     - "New York"
#   block:
#     - "India"
#     - "Bengaluru"
#     - "United Kingdom"
#     - "London"
#     - "Germany"
#     - "France"
#     - "Singapore"
#     - "Japan"
#     - "Brazil"
#     - "Australia"

# -- Country-eligibility filter (optional, opt-in, #2093) --
# location_filter only reads the ATS provider's STRUCTURED location field
# (e.g. "Remote"). Many US companies tag every remote requisition "Remote"
# regardless of which countries are actually eligible — the real
# restriction ("US-based candidates only" vs. "US or Canada eligible")
# often lives only in the job description BODY TEXT. This filter reads that
# text (same field content_filter reads) and cross-references it against
# your own country from `location.country` above.
#
# Semantics (case-insensitive substring), same "don't penalize missing
# data" discipline as location_filter:
#   - Your location.country is "United States" → filter no-ops entirely
#     (a "US only" restriction can never exclude a US-based candidate)
#   - No description text available → pass
#   - No `exclusionary` phrase matched → pass (ambiguous stays ambiguous)
#   - `exclusionary` phrase matched but an `inclusive` phrase is also
#     present, or your own country is separately named in the text → pass
#   - `exclusionary` phrase matched, no `inclusive` phrase, your country
#     not named → rejected, counted in scan-runs.tsv's
#     filtered_country_eligibility column
#
# If this entire block is absent, behavior is unchanged (no country
# filtering — same as before this feature existed).

# country_eligibility_filter:
#   exclusionary:
#     - "must be located in the united states"
#     - "us-based candidates only"
#     - "authorized to work in the us without sponsorship"
#   inclusive:
#     - "united states or canada"
#     - "north america"
#     - "canada eligible"

# -- Salary filter (optional) --
# Filter scanned jobs by annual compensation range. Applied AFTER location
# filter, BEFORE dedup. Only applies when structured salary data exists.
#
# Semantics:
#   - min/max are annual compensation filters (use annualized values)
#   - max: 0 means "no upper limit"
#   - If no salary data exists on a job, it passes (conservative behavior)
#   - If both currencies are known and differ, the job is rejected by the salary filter
#   - Partial ranges (min only or max only) work correctly
#   - If this entire block is absent, salary is not filtered (default behavior)
#
# Example: target roles paying at least $100k, no upper limit
# salary_filter:
#   min: 100000
#   max: 0
#   currency: "USD"

# -- Posting-age filter (optional) --
# Opt-in freshness gate. Skips offers whose posting date (postedAt, supplied by
# the provider) is older than N days. Offers from providers that expose no date
# are never skipped — same "don't penalize missing data" rule as location_filter.
# Absent, 0, or non-positive → disabled (all ages pass).
#
# max_posting_age_days: 45
#
# Need an ABSOLUTE date window instead (e.g. "only postings from the 17th to
# the 20th") rather than a relative "N days old" cutoff? Use the CLI flags
# instead of a portals.yml key: `node scan.mjs --posted-after 2026-07-17
# --posted-before 2026-07-20`. Same "don't penalize missing data" rule.

# -- Trust filter (optional) --
# Enriches each scanned job with a trust score (0-100) and flags.
# Jobs are NEVER dropped — only annotated. The trust score helps you
# prioritize which postings to evaluate first.
#
# Heuristics (V1):
#   1. URL structure validation (malformed or non-http URLs)
#   2. Missing application URL
#   3. Suspicious domain detection (link shorteners, form builders)
#   4. Company ↔ domain mismatch (with ATS allowlist)
#
# If this block is absent or enabled: false, all jobs get score 100.
#
# trust_filter:
#   enabled: true
#   suspicious_domains:
#     - "bit.ly"
#     - "tinyurl.com"
#     - "t.co"
#     - "forms.gle"
#     - "goo.gl"
#     - "shorturl.at"
#   # Override the built-in ATS allowlist (greenhouse, lever, workday, etc.).
#   # URLs hosted on these domains skip the company↔domain mismatch check.
#   # ats_allowlist:
#   #   - "greenhouse.io"
#   #   - "ashbyhq.com"
#   #   - "lever.co"
#   #   - "custom-ats.example.com"

# -- Content filter (optional) --
# Filters on the job DESCRIPTION text, not just the title — useful when
# companies post generic titles ("Software Engineer") with very different
# stacks. Case-insensitive substring match.
# Semantics:
#   - A job with no description always passes (see provider support below)
#   - Any `negative` keyword present → reject
#   - `positive` empty → pass (after clearing negatives)
#   - `positive` non-empty → at least one keyword must be present
#   - If this entire block is absent, descriptions are not filtered (default)
#
# Provider support: the scanner is zero-token and only reads a description when
# the provider's list API returns it for free — it never fetches each job page.
# Jobs from a provider that doesn't supply one always pass this filter (never
# silently dropped). Check which providers qualify:
# `grep -l 'description:' providers/*.mjs`.
#
# Whole-word / stem matching (opt-in, per entry): a plain keyword is a
# substring, so a negative "java" also rejects "JavaScript" and "ios" rejects
# "curiosity". Prefix an entry with `word:` or `stem:` — identical semantics to
# title_filter (see that section above for the full table):
#   - `word:java`   whole word only — keeps "JavaScript", still blocks a Java shop
#   - `stem:ios`    left boundary only — keeps "curiosity", still blocks "iOS"
# A keyword that STARTS the unwanted word ("java" in "javascript") needs
# `word:`; one that lands MID-word ("ios" in "curiosity") is closed by `stem:`
# too. Entries without a prefix are unchanged, so existing configs behave
# exactly as before.
#
# Example: keep roles that mention Rust/Go, drop legacy PHP/WordPress shops
# content_filter:
#   positive:
#     - "rust"
#     - "golang"
#   negative:
#     - "php"
#     - "wordpress"
#
# by_title_keyword (optional): scope a stricter positive/negative pair to only
# the jobs matched via a specific title_filter.positive keyword, instead of
# applying it to every scanned job. Useful when a title keyword is broad
# enough to need extra confirmation from the description (e.g. "AI Engineer"
# roles where you want the JD to actually mention a concrete AI tool) without
# that same requirement leaking onto unrelated categories (Instructional
# Designer, HR Coordinator, ...). Jobs matched via a keyword with no entry
# here fall back to the global positive/negative pair above.
# content_filter:
#   by_title_keyword:
#     "AI Engineer":
#       positive:
#         - "gpt"
#         - "llm"
#         - "claude"

# -- Visa / work-authorization filter (optional) --
# Surfaces roles that sponsor a work visa (H-1B / H-1B1 / O-1 for the US, plus
# the generic "visa sponsorship" wording) and drops roles that explicitly refuse
# it. Like content_filter it reads the job DESCRIPTION text, so it only has
# signal for providers that populate job.description (see the content_filter
# provider-support note above).
# Semantics (case-insensitive substring):
#   - Any `negative` keyword present → reject (an explicit "no sponsorship")
#   - require_mention: false (default) → after clearing negatives, pass — jobs
#     with no description included. Use this to only weed out explicit rejections.
#   - require_mention: true → keep only jobs whose description advertises
#     sponsorship (contains a `positive` keyword); missing description → reject.
#   - `positive`/`negative` default to a curated US-sponsorship vocabulary when
#     omitted, so `visa_filter: { enabled: true }` works out of the box.
#   - If this entire block is absent, jobs are not filtered on sponsorship.
#
# Minimal: drop only the postings that say they won't sponsor
visa_filter:
  enabled: true
#
# Strict: only surface postings that explicitly advertise US sponsorship
visa_filter:
  enabled: true
  require_mention: true
  positive:
    - "visa sponsorship"
    - "will sponsor"
    - "UK Skilled Visa"
  negative:
    - "no sponsorship"
    - "unable to sponsor"

# -- Title filter --
# The scanner uses these keywords to decide if a title is relevant.
# At least 1 positive must match AND 0 negatives must match (case-insensitive).
#
# skip_tiers: [intern, entry]  # optional: skip listings by seniority tier (note: unrecognized/plain titles fall back to 'mid')

title_filter:
  # A `positive` entry is matched case-insensitively as a substring — except a
  # 2-3 letter keyword ("AI", "ML", "VP"), which is matched on word boundaries
  # so it does not fire inside another word ("AI" will not match "Maintenance").
  # Either way an entry expresses the exact spelling you write, and nothing
  # else: real titles vary in separator and word order, and every variant your
  # list does not literally contain is dropped in silence.
  #
  # Prefix an entry with `word:` to demand a WHOLE WORD at any length, in either
  # list. This matters most on the negative side, where a short word hides inside
  # longer ones: a bare "Intern" also rejects every "Internal" and
  # "International" title, and if you keep "Internal Tools" as a positive it can
  # then never match at all, because the negative fires inside the positive's own
  # text. `word:Intern` rejects "Operations Intern" and leaves both alone.
  #
  # Anchoring is opt-in per entry ON PURPOSE. A `word:` prefix also adds the
  # RIGHT-hand boundary, which a negative usually wants to keep: "Crypto" is
  # there to catch "Cryptocurrency" too. So anchor the entries that need it and
  # add the suffix forms you still want gone, the way the negative list below
  # pairs `word:Intern` with `word:Interns` and a plain `Internship`.
  #
  # Prefix an entry with `stem:` for the half in between. A plain keyword is
  # loose on BOTH sides, and usually only one of them was meant:
  #
  #   agent         Agentforce yes   Agents yes   Reagents yes   <- the default
  #   stem:agent    Agentforce yes   Agents yes   Reagents NO    <- must START a word
  #   word:agent    Agentforce NO    Agents NO    Reagents NO    <- the whole word
  #
  # So `stem:` is for a keyword that begins a longer word you also want — "Crypto"
  # reaching "Cryptocurrency", "Fellows" reaching "Fellowship" — without it also
  # landing in the middle of an unrelated one. It is what separates "Rust
  # Engineer" from "Zero Trust Engineer" while keeping "Rust Engineering".
  #
  # It does NOT cover a keyword that ENDS a longer word instead of starting it:
  # "Automation" inside the German compound "Gebäudeautomation" still needs the
  # plain form. That side has no prefix, deliberately — the plain default already
  # serves it, and nothing has been measured that the pair cannot express.
  #
  # Nor does it close the MIRROR case, which is worth knowing before reaching for
  # it: a keyword that genuinely STARTS the unwanted word. "Solana" does begin
  # "Solanaceae", "Neutron" begins "Neutronics", "DeFi" begins "Defined" — `stem:`
  # asks for the left boundary only, so it matches all three on purpose, and only
  # `word:` closes them. Measured over the 675 observed titles in
  # tests/fixtures/title-recall-corpus.json, that is where the two prefixes divide:
  #
  #   stem: closes      Zero Trust Engineer, NASTAR Course Setter        4 titles
  #   only word: closes Solanaceae, Neutronics, Software Defined (x3),
  #                     Product Definer, Product Definition              7 titles
  #
  # And `word:` is not free on that same corpus: it also drops 4 titles you
  # probably wanted — "Engineering Manager, Smart Contracts" and "Engineering
  # Lead - Crypto and DeFi" among them — because it forbids the suffix too. So
  # reach for `stem:` when a keyword lands MID-word, and for `word:` when it lands
  # at the START of a word you did not mean, knowing that costs the plural and
  # compound forms as well.
  #
  # Use " + " (with spaces) to require SEVERAL terms in any order:
  #
  #   - "director + engineering"   matches "Director of Engineering",
  #                                "Director - Software Engineering",
  #                                "Senior Director, Platform Engineering",
  #                                "Director Engineering (Mobile Platform)"
  #
  # One entry replaces the whole {level} x {separator} x {domain word} matrix.
  # An entry with no " + " behaves exactly as before, and a literal "+" without
  # surrounding spaces is left alone — "C++" stays the keyword C++.
  positive:
    # [CUSTOMIZE] Add keywords matching YOUR target roles
    # -- AI/ML roles --
    - "AI"
    - "ML"
    - "LLM"
    - "Agent"
    - "Agentic"
    - "GenAI"
    - "Generative AI"
    - "NLP"
    - "LLMOps"
    - "MLOps"
    - "Voice AI"
    - "Conversational AI"
    - "Speech"
    # -- German AI/ML keywords (DACH market) --
    - "KI"
    - "Künstliche Intelligenz"
    - "KI Engineer"
    - "KI Trainer"
    - "Dozent"
    - "Weiterbildung"
    # -- Engineering roles --
    - "Platform Engineer"
    - "Solutions Architect"
    - "Solutions Engineer"
    - "Forward Deployed"
    - "Deployed Engineer"
    - "Customer Engineer"
    - "Integration Engineer"
    # -- Product roles --
    - "Product Manager"
    - "Technical PM"
    # -- Automation roles --
    - "Automation"
    - "Hyperautomation"
    - "Low-Code"
    - "No-Code"
    - "GTM Engineer"
    - "RevOps"
    - "Business Systems"
    - "Internal Tools"
    - "Transformation"
    # --- Healthcare example (uncomment your profession, remove the rest) ---
    # # -- Healthcare roles --
    # # Adapt for your specialty: "Registered Nurse", "Physician Assistant", "Medical Assistant",
    # # "Healthcare Administrator", "Clinical Research Coordinator", "ICU Nurse", "Pediatric Nurse", etc.
    # - "Registered Nurse"
    # - "RN"
    # - "Physician Assistant"
    # - "Medical Assistant"
    # - "Healthcare Administrator"
    # - "Clinical Research"
    # - "Nurse Practitioner"
    # - "Licensed Practical Nurse"
    # - "LPN"

    # --- Finance/Operations example (uncomment your profession, remove the rest) ---
    # # -- Finance/Operations roles --
    # # Adapt for your specialty: "Financial Analyst", "Financial Planner", "Accountant",
    # # "Operations Manager", "Project Manager", "Business Analyst", "PMO", "Controller", etc.
    # - "Financial Analyst"
    # - "Financial Planner"
    # - "Accountant"
    # - "Operations Manager"
    # - "Project Manager"
    # - "Business Analyst"
    # - "PMO"
    # - "Controller"
    # - "FP&A"
    # - "Treasury"

    # --- Marketing/Sales/Customer Success example (uncomment your profession, remove the rest) ---
    # # -- Marketing/Sales/Customer Success roles --
    # # Adapt for your specialty: "Marketing Manager", "Sales Manager", "Customer Success Manager",
    # # "Account Executive", "Business Development", "Growth Marketing", "Product Marketing", etc.
    # - "Marketing Manager"
    # - "Sales Manager"
    # - "Customer Success Manager"
    # - "Account Executive"
    # - "Business Development"
    # - "Growth Marketing"
    # - "Product Marketing"
    # - "Content Marketing"
    # - "Brand Manager"
  negative:
    # [CUSTOMIZE] Add keywords for roles you want to exclude
    - "Junior"
    # Whole-word: a bare "Intern" is a substring, so it also rejected every
    # "Internal" and "International" title and made the "Internal Tools"
    # positive above unmatchable. The next two entries are the other half of
    # that change, since anchoring stops "Intern" reaching the suffix forms the
    # loose substring had been catching by accident. "Internship" stays a plain
    # substring so it also covers "Internships" and "Internship Programme".
    - "word:Intern"
    - "word:Interns"
    - "Internship"
    # -- Engineering-specific negatives (only for engineering searches) --
    # Remove these if you're targeting other professions - they're tech-stack
    # filters for software engineering roles.
    - ".NET"
    - "Java "
    - "iOS"
    - "Android"
    - "PHP"
    - "Ruby"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "ASIC"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Salesforce Admin"
    - "SAP "
    - "Oracle EBS"
    - "Mainframe"
    - "COBOL"
    # -- German student / apprenticeship postings (DACH market) --
    # Large DACH employers publish these in volume, and the German AI keywords
    # in title_filter.positive ("KI", "Künstliche Intelligenz") match them, so
    # without these a scan of one big employer returns mostly student ads.
    - "Werkstudent"
    - "Praktikant"
    - "Praktikum"
    - "Masterarbeit"
    - "Bachelorarbeit"
    - "Abschlussarbeit"
    - "PreMaster"
    - "Duales Studium"
    - "Ausbildung"
    # Qualified rather than a bare "Thesis": keywords longer than three
    # characters match as plain substrings, so "Thesis" would also reject
    # "Speech Synthesis Engineer" — and "Speech" is a positive keyword above.
    - "Master Thesis"
    - "Bachelor Thesis"
    # -- Support roles that match on "Agent" --
    # "Customer Care Agent" and its German equivalent otherwise pass the
    # "AI Agent" / "Agent" side of the positive list.
    #
    # The ROLE, not the domain. A bare "Customer Care" is a substring, so it also
    # rejected senior AI roles that name customer care as the area they serve -
    # measured on a 2,399-title corpus: "AI Agents Manager: Customer Care" and
    # "AI Support Delivery Manager: Customer Care". Both are AI roles for a
    # support organisation, not support-agent jobs. The support titles the bare
    # form was meant to catch - "Customer Care Onboarding", "Customer Care
    # Operations" - carry no positive keyword at all, so they were already
    # excluded and the shorter negative bought nothing for them.
    - "Customer Care Agent"
    - "Kundenbetreuung"
  seniority_boost:
    # These prefixes add relevance but are not required
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head"
    - "Director"

# -- Search queries --
# Each query triggers a WebSearch. Use site: to filter by portal.
# The scanner extracts title, URL, and company from results.

search_queries:
  # -- Visa sponsorship (US) --
  # Explicitly hunt for roles that sponsor a US work visa. Pair these with the
  # `visa_filter` block above (require_mention: true) so the scan-side filter
  # double-checks the description for sponsorship wording. Disabled by default —
  # flip enabled: true if you need sponsorship.
  - name: Greenhouse — AI + visa sponsorship
    query: 'site:boards.greenhouse.io ("AI Engineer" OR "ML Engineer") ("visa sponsorship" OR "H-1B" OR "H1B1")'
    enabled: false

  - name: Ashby — AI + visa sponsorship
    query: 'site:jobs.ashbyhq.com ("AI Engineer" OR "LLM Engineer") ("visa sponsorship" OR "will sponsor")'
    enabled: false

  - name: Lever — AI + visa sponsorship
    query: 'site:jobs.lever.co ("AI Engineer" OR "Machine Learning") ("visa sponsorship" OR "H-1B")'
    enabled: false

  - name: Wellfound - AI + Visa sponsorship
    query: 'site:wellfound.com "AI Engineer" OR "LLM Engineer" OR "Forward Deployed" ("visa sponsorship" OR "will sponsor")'
    enabled: true

  # --- Healthcare example (uncomment your profession, remove the rest) ---
  # # -- Healthcare --
  # # Adapt these terms for your healthcare specialty: "Registered Nurse", "Physician Assistant",
  # # "Medical Assistant", "Healthcare Administrator", "Clinical Research Coordinator", etc.
  # # Add location-specific terms like "RN" (Registered Nurse), "LPN" (Licensed Practical Nurse),
  # # or specialization keywords like "ICU", "Pediatrics", "Emergency", "Cardiology".
  # - name: Ashby — Healthcare
  #   query: 'site:jobs.ashbyhq.com "Registered Nurse" OR "RN" OR "Healthcare Administrator" remote'
  #   enabled: true
  # 
  # - name: Greenhouse — Healthcare
  #   query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Registered Nurse" OR "Physician Assistant" OR "Healthcare Administrator" remote'
  #   enabled: true
  # 
  # - name: Wellfound — Healthcare
  #   query: 'site:wellfound.com "Registered Nurse" OR "RN" OR "Healthcare Administrator" remote'
  #   enabled: true

  # --- Finance/Operations example (uncomment your profession, remove the rest) ---
  # # -- Finance / Operations --
  # # Adapt these terms for your finance/ops specialty: "Financial Analyst", "Financial Planner",
  # # "Accountant", "Operations Manager", "Project Manager", "Business Analyst", "PMO", etc.
  # # Add industry-specific terms like "FP&A" (Financial Planning & Analysis), "Controller",
  # # "Treasury", "Risk Management", "Compliance", "Audit", or specialization keywords like
  # # "Corporate Finance", "Investment Banking", "Private Equity", "Venture Capital".
  # - name: Ashby — Finance/Operations
  #   query: 'site:jobs.ashbyhq.com "Financial Analyst" OR "Operations Manager" OR "Project Manager" remote'
  #   enabled: true
  # 
  # - name: Greenhouse — Finance/Operations
  #   query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Financial Analyst" OR "FP&A" OR "Operations Manager" remote'
  #   enabled: true
  # 
  # - name: Wellfound — Finance/Operations
  #   query: 'site:wellfound.com "Financial Analyst" OR "Operations Manager" OR "Project Manager" remote'
  #   enabled: true

  # --- Marketing/Sales/Customer Success example (uncomment your profession, remove the rest) ---
  # # -- Marketing / Sales / Customer Success --
  # # Adapt these terms for your marketing/sales specialty: "Marketing Manager", "Sales Manager",
  # # "Customer Success Manager", "Account Executive", "Business Development", "Growth Marketing",
  # # "Product Marketing", "Content Marketing", "Brand Manager", etc.
