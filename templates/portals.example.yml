# -- Tracked companies --
# Companies whose career pages are checked directly.
# scan_method: playwright (default), websearch, local_parser
# For Greenhouse companies, add api: field for faster structured JSON access.
#
# Provider routing (scan.mjs):
#   By default each entry is auto-detected from `careers_url` against the
#   loaded providers in providers/*.mjs (local-parser, ashby, greenhouse, lever).
#   local-parser runs first when parser.command + parser.script are set.
#
#   Optional fields on a tracked_companies entry:
#     provider: <id>     — force a specific provider, skipping detect().
#     transport: http    — reserved for future transports. Defaults to http.
#
# For SSR/static career pages, add parser.command + parser.script. The command
# can be python3, node, or another local executable. The script must print JSON
# jobs to stdout: [{ "title": "...", "url": "...", "location": "..." }]
#
# Generic local parser examples. Most parser scripts are company-specific and
# already know their target careers URL. `args` are optional and can help the
# parser author (reuse across companies, debug flags, JSON snapshots, etc.).
#
# JavaScript parser:
# - name: Example JS Company
#   careers_url: https://example.com/careers
#   scan_method: local_parser
#   parser:
#     command: node
#     script: scripts/parsers/example-js-company-jobs.js
#     format: jobs-json-v1
#   enabled: true
#
# Python parser:
# - name: Example Python Company
#   careers_url: https://example.org/jobs
#   scan_method: local_parser
#   parser:
#     command: python3
#     script: scripts/parsers/example_python_company_jobs.py
#     format: jobs-json-v1
#   enabled: true

# ── Provider auto-detection ───────────────────────────────────────
# scan.mjs auto-loads everything in providers/*.mjs and tries each
# provider's detect() in order. URL patterns recognized:
#
#   greenhouse      job-boards(.eu)?.greenhouse.io/<slug>  (or api: field)
#   ashby           jobs.ashbyhq.com/<slug>
#   lever           jobs.(eu.)?lever.co/<slug>
#   workable        apply.workable.com/<slug>
#   smartrecruiters (careers|jobs).smartrecruiters.com/<slug>
#   recruitee       <slug>.recruitee.com
#   bamboohr        <tenant>.bamboohr.com               (or api: field)
#   breezy          <tenant>.breezy.hr                  (or api: field)
#   solidjobs       solid.jobs/public-api/offers/<division>
#   comeet          api: https://www.comeet.co/careers-api/2.0/company/<uid>/positions?token=<token>
#   personio        <slug>.jobs.personio.(de|com)
#   pinpoint        <slug>.pinpointhq.com
#   rippling        ats.rippling.com/<slug>/jobs
#   jibeapply       <slug>.jibeapply.com/jobs  (or provider: jibeapply + api: for a branded host's own /jobs path)
#   jobvite         jobs.jobvite.com/<slug>  (add company_eid: to skip the board lookup — see the stanza below)
#   tencent         careers.tencent.com  (zh-CN board; each keywords: entry queried server-side, results deduped)
#   meituan         zhaopin.meituan.com  (zh-CN board; each keywords: entry queried server-side, results deduped)
#   alibaba         talent.alibaba.com   (zh-CN board; each keywords: entry queried server-side, results deduped)
#   feishu-jobs     jobs.bytedance.com or <tenant>.jobs.feishu.cn
#   mokahr          app.mokahr.com/(social-recruitment|campus-recruitment|apply)/<org>/<siteId>
#   workday         <tenant>.wd<N>.myworkdayjobs.com[/<locale>]/<board>
#   avature         <tenant>.avature.net  (branded host → provider: avature + api: the /careers/SearchJobs URL)
#   amazon          amazon.jobs           (global board; provider: amazon + an amazon: filter block, see below)
#   successfactors  *.successfactors.(eu|com) / *.jobs2web.com  (SAP SF Recruiting Marketing / RMK boards;
#                   branded hosts like jobs.<company>.com need provider: successfactors + api: <board origin>)
#   oraclecloud     <tenant>.fa[.<region>][.ocs].oraclecloud[1-99].com/hcmUI/CandidateExperience/.../sites/<siteNumber>/jobs
#                   (Oracle Recruiting Cloud / Fusion CX — JPMorgan, Oracle, BNY, Amex, Honeywell; siteNumber
#                   auto-derived from the URL, override with provider: oraclecloud + siteNumber: / optional locationId:.
#                   Newer tenants are issued a NUMBERED apex, e.g. <tenant>.fa.ocs.oraclecloud26.com — same shapes,
#                   same provider; just use whichever host the employer's careers link actually points at.)
#   eightfold       <tenant>.eightfold.ai  (Eightfold AI talent-acquisition boards; a branded CNAME like
#                   careers.<company>.com is NOT matched — point at the eightfold.ai host. Optional domain:
#                   for multi-brand tenants. Page size is server-capped at 10, so bound big boards with max_pages)
#   gem             jobs.gem.com/<boardId>
#   join            join.com/companies/<slug>  (SSR __NEXT_DATA__ parse, no separate API)
#   icims           careers-<tenant>.icims.com / *.icims.com
#
# When the public careers URL is a branded custom domain (e.g.
# careers.adyen.com), set `provider: smartrecruiters` explicitly to
# bypass detect(). The `provider:` field wins over auto-detection.
#
# phenom has no detect() at all — every tenant runs on its own branded
# domain, and every legacy <tenant>.phenompeople.com host we've found
# permanently redirects to that branded domain (which this provider's
# fetch() can't follow), so there's no URL pattern worth auto-claiming.
# Always set `provider: phenom` + `careers_url` pointed at the branded
# origin (the /widgets endpoint lives on that same origin, so no separate
# `api:` is needed).
#
# Some providers are job boards / aggregators with no per-company careers
# URL to detect, so they must be selected with an explicit `provider:`
# field: 4dayweek, agentic-jobs, arbeitnow, arbeitsagentur, flowxtra, getonbrd, glints,
# himalayas, ibm, jobbankca, jobicy, jobstreet, justjoin, landingjobs, mycareersfuture, nofluffjobs, remoteok, remotive, senjob,
# manfred, thehub, vdab, weworkremotely, workingnomads, wttj, a16z-speedrun-talent. Examples for every built-in provider are below.

# ── Built-in provider examples ────────────────────────────────────
# One commented stanza per provider in providers/. Uncomment one and adjust.
# A provider whose host is auto-detected (company ATS or job board) only needs
# careers_url; the rest need provider: plus any fields shown.
#
# Grouped by which list the stanza belongs in: the "Company ATS" group goes
# under tracked_companies: (one entry = one employer); the "Job boards /
# aggregators" and "Remote-job feeds" groups go under job_boards: (one entry =
# many employers).
#
# -- Company ATS  (→ tracked_companies:; careers_url is enough unless noted) --
#
# - name: Example BambooHR Co
#   careers_url: https://exampleco.bamboohr.com/careers   # any *.bamboohr.com host
#   enabled: true
#
# - name: Example Breezy Co
#   careers_url: https://exampleco.breezy.hr              # any *.breezy.hr host
#   enabled: true
#
# - name: Example Pinpoint Co
#   careers_url: https://exampleco.pinpointhq.com         # any *.pinpointhq.com host
#   enabled: true
#
# - name: Example Rippling Co
#   careers_url: https://ats.rippling.com/exampleco/jobs  # any ats.rippling.com/<slug>
#   enabled: true
#
# - name: Example JibeApply Co
#   careers_url: https://exampleco.jibeapply.com/jobs     # any *.jibeapply.com/jobs host
#   max_pages: 50          # optional page cap (10 jobs/page, default 50, max 500) —
#                          # raise it for a tenant with 500+ open postings (a warning
#                          # is logged if the cap truncates real results)
#   enabled: true
#
# - name: Example Jobvite Co
#   careers_url: https://jobs.jobvite.com/exampleco       # any jobs.jobvite.com/<slug> board
#   company_eid: q6NaVfwI   # optional but recommended. The XML feed keys on this opaque
#                           # id, NOT the vanity slug, so without it every scan spends an
#                           # extra request scraping it off the board page. Find it in the
#                           # board page source as companyEId: '…'.
#   enabled: true
#
# - name: Example Jobvite Co (explicit feed URL)
#   provider: jobvite
#   api: https://app.jobvite.com/CompanyJobs/Xml.aspx?c=q6NaVfwI   # eId read from ?c=
#   enabled: true
#
# - name: 腾讯 (Tencent)
#   careers_url: https://careers.tencent.com/search.html  # any https://careers.tencent.com URL
#   keywords: ["AI", "大模型"]   # each keyword is a separate server-side query, results deduped;
#                                # omit keywords to pull the whole board
#   max_pages: 20          # optional per-keyword page cap (100 posts/page, default 20)
#   enabled: true
#
# - name: 美团 (Meituan)
#   careers_url: https://zhaopin.meituan.com/web/social   # any https://zhaopin.meituan.com URL
#   keywords: ["AI", "大模型"]   # each keyword is a separate server-side query, results deduped;
#                                # omit keywords to pull the whole board
#   max_pages: 30          # optional per-keyword page cap (100 posts/page, default 30)
#   enabled: true
#
# - name: 阿里巴巴 (Alibaba)
#   careers_url: https://talent.alibaba.com/off-campus/position-list   # any https://talent.alibaba.com URL
#   keywords: ["AI", "大模型"]   # each keyword is a separate server-side query, results deduped;
#                                # omit keywords to pull the whole board
#   max_pages: 50          # optional per-keyword page cap (100 posts/page, default 50)
#   enabled: true
#
# - name: Example Feishu Jobs Co
#   careers_url: https://exampleco.jobs.feishu.cn
#   keywords: ["AI", "大模型"]
#   max_pages: 20          # optional per-keyword page cap (100 posts/page)
#   enabled: true
#
# - name: Example MokaHR Co
#   careers_url: https://app.mokahr.com/social-recruitment/exampleco/123456
#   keywords: ["AI", "大模型"]
#   max_pages: 10          # optional per-keyword page cap (20 posts/page)
#   enabled: true
#
# - name: Example Workable Co
#   careers_url: https://apply.workable.com/exampleco   # any apply.workable.com/<slug> host
#   enabled: true
#
# - name: Example Workday Co
#   careers_url: https://exampleco.wd5.myworkdayjobs.com/en-US/exampleco-careers  # any <tenant>.wd<N>.myworkdayjobs.com
#   max_pages: 100         # optional page cap (20 jobs/page, default 100, max 1500) —
#                          # raise it for a tenant with 2000+ open postings (a warning
#                          # is logged if the cap truncates real results)
#   enabled: true
#
# - name: Example Oracle Recruiting Cloud Co
#   # Oracle Recruiting Cloud / Fusion Candidate Experience. Auto-detects any
#   # <tenant>.fa[.<region>][.ocs].oraclecloud[1-99].com host (the numbered apex,
#   # e.g. oraclecloud26.com, is what newer tenants get) and derives siteNumber
#   # from the /sites/<siteNumber>/ path segment (default CX_1).
#   careers_url: https://exampleco.fa.oraclecloud.com/hcmUI/CandidateExperience/en/sites/CX_1/jobs
#   max_pages: 25          # optional page cap (200 jobs/page, default 25 ≈ 5000 jobs, max 25)
#   enabled: true
#
# - name: JPMorgan Chase                    # worked override example
#   # Override form: pin the host + siteNumber explicitly (useful when the public
#   # careers link is branded or the /sites/<n>/ segment isn't in the URL you have).
#   careers_url: https://jpmc.fa.oraclecloud.com/hcmUI/CandidateExperience/en/sites/CX_1002/jobs
#   provider: oraclecloud
#   siteNumber: CX_1002    # the site number after /sites/ (JPMC's external site)
#   # locationId: 300000000123456   # optional — some tenants (BNY, Amex) need it to scope results
#   max_pages: 25
#   enabled: true
#
# - name: Example Eightfold Co
#   # Eightfold AI talent-acquisition board. Auto-detects any *.eightfold.ai
#   # tenant host. A branded CNAME (careers.exampleco.com) is NOT matched — the
#   # API is host-pinned, so point careers_url (or api:) at the eightfold.ai form.
#   careers_url: https://exampleco.eightfold.ai/careers
#   # domain: exampleco.com  # optional — the server infers it from the tenant
#                            # host; set it only for multi-brand tenants that
#                            # scope their board by domain.
#   max_pages: 200         # optional page cap. The API caps a page at 10 rows
#                          # no matter what, so 200 pages ≈ 2000 postings
#                          # (default 200, max 1000). Raise it for a huge board.
#   enabled: true
#
# - name: Example Phenom Co
#   # Phenom People "CareerConnect" career site — the branded per-company
#   # domain many large enterprises run. No auto-detection (no reliable
#   # URL pattern to key on), so provider: phenom must always be set
#   # explicitly.
#   careers_url: https://careers.exampleco.com
#   provider: phenom
#   max_pages: 20          # optional page cap (100 jobs/page, default 20, max 300) —
#                          # raise it for a tenant with 2000+ open postings (a warning
#                          # is logged if the cap truncates real results)
#   phenom:                # optional widget config block
#     lang: en_global        # widget locale (default en_global)
#     country: global        # widget country scope (default global)
#     urlPrefix: global/en   # public job-page path prefix (default global/en)
#     selectedFields: { country: ["Germany"] }   # optional facet filter
#   enabled: true
#
# - name: Example Avature Co
#   # Avature career site. Auto-detects any *.avature.net host; for a branded
#   # host that proxies Avature, set provider: avature + api: the SearchJobs URL.
#   careers_url: https://exampleco.avature.net/careers/SearchJobs
#   max_pages: 50          # optional page cap (only 6 jobs/page — Avature's hard
#                          # limit — so ~300 postings by default, max 200 pages)
#   enabled: true
#
# - name: Example iCIMS Co
#   # iCIMS hosted-portal board. Auto-detects any *.icims.com host from
#   # careers_url/api.
#   careers_url: https://careers-exampleco.icims.com/jobs/search?ss=1
#   enabled: true
#
# - name: Example SuccessFactors Co
#   # SAP SuccessFactors Recruiting Marketing (RMK, ex-jobs2web) branded board —
#   # what many large industrials run at their own domain (jobs.<company>.com).
#   # Branded hosts carry no "successfactors" string, so set provider: explicitly
#   # and point api: at the board origin (host only, no path). The provider pulls
#   # the public /tile-search-results fragment (zero-token, no auth).
#   careers_url: https://www.exampleco.com/careers   # public/branded careers page
#   provider: successfactors
#   api: https://jobs.exampleco.com                  # RMK board origin
#   enabled: true
#
# - name: Example join.com Co
#   # join.com career page. Auto-detects any join.com/companies/<slug> URL and
#   # parses the __NEXT_DATA__ JSON embedded in the server-rendered HTML — no
#   # separate API.
#   careers_url: https://join.com/companies/exampleco
#   max_pages: 50           # optional page cap (default 50, max 200) — raise it
#                            # for a tenant with 50+ pages of postings (a warning
#                            # is logged if the cap truncates real results)
#   enabled: true
#
# Single-employer career sites on their own dedicated provider. Most auto-detect
# from the company's own host (provider: optional, shown for clarity); a few need
# it named. All still go under tracked_companies:.
#
# - name: Dassault Systèmes              # single-company; Exalead card_search_api
#   careers_url: https://www.3ds.com/careers/jobs   # auto-detects on *.3ds.com
#   provider: dassault                    # optional — 3ds.com host also auto-detects
#   enabled: true                         # ~445 English postings (zero-token XML)
#
# - name: Deutsche Bahn                   # single-company; db.jobs Avature front
#   careers_url: https://db.jobs          # auto-detects; SSR search, paginated over HTTP
#   provider: deutschebahn                # optional — db.jobs host also auto-detects
#   enabled: true
#
# - name: Garena                          # single-company; public zero-auth POST API
#   careers_url: https://careers.garena.com/global   # auto-detects on careers.garena.com
#   provider: garena                      # optional — careers.garena.com host also auto-detects
#   garena:
#     office: global                      # optional — sent as the API office parameter and reused in job URLs; no client-side filtering
#   enabled: true
#
# - name: Heckler & Koch                  # single-company; SSR Nuxt vacancy list
#   careers_url: https://www.heckler-koch.com/de/Karriere/Stellenangebote
#   provider: hecklerkoch                 # optional — heckler-koch.com host also auto-detects
#   enabled: true
#
# - name: Rheinmetall                     # single-company; SSR Nuxt vacancy list
#   careers_url: https://www.rheinmetall.com/en/career/vacancies
#   provider: rheinmetall                 # optional — rheinmetall.com host also auto-detects
#   enabled: true
#
# - name: OHB                             # Cornerstone OnDemand (csod) branded site
#   careers_url: https://career-ohb.csod.com/ux/ats/careersite/4/home?c=career-ohb
#   provider: csod                        # anonymous-JWT bootstrap, then public search API
#   enabled: true
#
# - name: RENK                            # softgarden hosted job widget
#   careers_url: https://renk-group.softgarden.io/de/widgets/jobs
#   provider: softgarden
#   enabled: true
#
# - name: Mercedes-Benz                   # BeeSite (milch & zucker) search backend
#   careers_url: https://mercedes-benz-beesite-production-gjb.app.beesite.de   # the *.app.beesite.de host, not the branded front (jobs.mercedes-benz.com)
#   provider: beesite
#   enabled: true
#
# -- Job boards / aggregators  (→ job_boards:; set provider: explicitly unless the host auto-detects) --
#
# - name: Amazon / AWS                    # global amazon.jobs board
#   provider: amazon
#   amazon:                # keys pass straight through to the search.json API
#     normalized_country_code: [DEU]   # array → facet filter (…[]=DEU); REQUIRED-ish,
#                                       # the board is 100k+ postings otherwise
#     base_query: machine learning      # optional keyword filter
#     # loc_query: Berlin               # optional free-text location (fuzzy, not a hard filter)
#   enabled: true
#
# - name: 4 Day Week                      # 4-day-week / reduced-hours roles
#   provider: 4dayweek
#   max_pages: 3          # optional page cap (25 jobs/page, default 3, max 50)
#   enabled: true
#
# - name: Built In                        # US tech aggregator, many employers
#   provider: builtin                     # no detect() — only reachable via provider:
#   builtin:
#     queries: ["platform engineer"]      # REQUIRED: queries and/or categories,
#     categories: [dev-engineering]       # otherwise there is nothing to scan
#     host: www.builtinseattle.com        # optional; one of nine market hosts,
#                                         # default builtin.com. The market host is the
#                                         # only location scoping this board offers.
#     scope: remote                       # optional; restricts to /jobs/remote
#     max_pages: 3                        # optional page cap (25 jobs/page, default 3)
#   enabled: true
#
# - name: The Hub                         # Nordic/EU startup board
#   provider: thehub
#   max_pages: 3          # optional page cap (15 jobs/page, default 3, max 67; applies to each pass below)
#   thehub:
#     countryCode: EU        # optional; any value the API accepts. Default: EU
#     includeRemote: false   # optional; also runs a separate isRemote=true pass, merged in. Default: false
#   enabled: true
#
# - name: a16z speedrun talent network    # a16z speedrun + wider a16z portfolio (~200 startups)
#   provider: a16z-speedrun-talent
#   max_pages: 3          # optional page cap (50 jobs/page, default 3)
#   q: machine learning   # optional server-side full-text search (synonyms expand)
#   enabled: true
#
# - name: Arbeitnow                       # EU/DACH-heavy board, newest-first
#   provider: arbeitnow
#   max_pages: 3          # optional page cap (100 jobs/page, default 3, max 50)
#   enabled: true
#
# - name: Flowxtra                        # board-wide, every company hosted on Flowxtra
#   provider: flowxtra
#   max_pages: 3          # optional page cap (100 jobs/page, default 3, max 50)
#   enabled: true
#
# - name: Arbeitsagentur — AI Roles      # German federal jobs API
#   provider: arbeitsagentur
#   arbeitsagentur:
#     keywords: ["AI Engineer", "Machine Learning"]  # required (>=1)
#     wo: Berlin          # optional anchor city ('' / omit = all of Germany)
