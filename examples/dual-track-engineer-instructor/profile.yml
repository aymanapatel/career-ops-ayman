# Career-Ops Profile -- Dual-Track Example (Backend + AI/ML Engineer)
#
# Adapted from Ayman Patel's CV. Demonstrates how to configure a profile when
# you are optimizing for TWO engineering archetypes at the same time -- e.g.
# Senior Backend Engineer AND Senior AI/ML Engineer. See README.md in this
# folder for the rationale and the interview-objection playbook.
#
# Copy this file to config/profile.yml and edit before using.

candidate:
  full_name: "Ayman Patel"
  email: "ayman.patel97@gmail.com"
  phone: "+44 7900 626876"
  location: "London, United Kingdom"
  linkedin: "linkedin.com/in/aymanapatel"
  portfolio_url: "https://patelofthought.com/me"
  github: "github.com/aymanapatel"
  website: "aymanace2049.hashnode.dev"

target_roles:
  # North Star -- TWO primary tracks, not one.
  primary:
    - "Senior Backend Engineer"
    - "Staff Backend Engineer"
    - "Senior AI/ML Engineer"
    - "AI Engineer"
  # Archetypes -- note: TWO entries with fit: primary.
  # The evaluator should pick whichever is closer to the JD at scoring time.
  archetypes:
    - name: "Senior Backend Engineer"
      level: "Senior/Staff"
      fit: "primary"
      track: "backend"
      sell_when: "JD emphasizes Spring Boot, microservices, payment systems, API design, caching (Redis), observability, CI/CD, Resilience4j, event sourcing with Kafka"
    - name: "Senior AI/ML Engineer"
      level: "Senior"
      fit: "primary"
      track: "ai"
      sell_when: "JD emphasizes LLM engineering, agent systems (LangGraph/ReAct), fine-tuning (LoRA), inference optimization (KV caching), RAG, MLOps, distributed training, GPU performance"
    - name: "Senior Full-Stack Engineer"
      level: "Senior"
      fit: "secondary"
      track: "fullstack"
      sell_when: "JD wants someone who can ship both backend (Spring/Java) AND frontend (React/TypeScript) -- the natural Mastercard-era landing zone"
    - name: "ML Platform / MLOps Engineer"
      level: "Senior"
      fit: "secondary"
      track: "mlops"
      sell_when: "JD wants distributed training infra, Kubernetes, Docker, CI/CD for ML, observability, containerized pipelines -- bridges backend and AI tracks"
    - name: "Forward Deployed AI Engineer"
      level: "Senior"
      fit: "adjacent"
      track: "hybrid"
      sell_when: "JD wants client-facing technical work, fast prototyping, customer enablement -- backend reliability plus AI depth becomes a differentiator here"

narrative:
  # One-line headline. Names BOTH tracks. The "rare combination" is the value.
  headline: "Backend engineer with 6+ years shipping payment systems at Mastercard, now building production AI -- LoRA fine-tuning, 6.69x inference speedups, and LangGraph agents that verify their own facts"
  # Exit story bridges both tracks into one coherent reason for the move.
  exit_story: "Spent 6 years building backend and frontend services for Mastercard's payment flows -- microservices, caching, observability, and a microfrontend platform for 10+ product modules. Then completed an AI Engineering Fellowship at Nebius (H100s, distributed training, GPU performance) and started an MSc in Advanced Computer Science at Queen Mary. Both sides are real: I ship production systems AND I understand transformers from scratch. Now optimizing for a role that uses both, or for one side at full intensity if the team is right."
  # Superpowers -- mix of backend AND AI/ML to reflect the dual track.
  superpowers:
    - "Ship production backend systems end-to-end (Spring Boot, Kafka, Redis, PostgreSQL, Resilience4j)"
    - "Build and optimize LLM systems from scratch (LoRA, MoE, RoPE, KV caching, 6.69x inference speedup)"
    - "Design AI agent architectures with verifiable facts (LangGraph ReAct, MCP tool layers, dataflow integrity checks)"
    - "Run distributed training on H100 clusters (DDP, torchrun, NCCL, Kubernetes, SkyPilot)"
    - "Write technical content that people actually read -- 40+ articles, featured in the eBPF newsletter, whitepapers circulated to 200+ engineers"
  # Proof points -- mix backend AND AI/ML wins, marked by track.
  proof_points:
    - name: "Mastercard Microservices Platform"
      url: "https://github.com/aymanapatel"
      hero_metric: "Owned 5+ microservices, Resilience4j circuit breakers improved availability 15%, RBAC/SBAC across 5+ products"
      track: "backend"
    - name: "Microfrontend Platform (Module Federation)"
      url: "https://github.com/aymanapatel"
      hero_metric: "10+ product modules deployed independently, reduced cross-team release coordination"
      track: "fullstack"
    - name: "KV Cache Inference Optimization"
      url: "https://github.com/aymanapatel/nebius-project"
      hero_metric: "6.69x speedup -- 0.943s to 0.141s for 128 tokens"
      track: "ai"
    - name: "LoRA Fine-tuning on GPT-2"
      url: "https://github.com/aymanapatel/nebius-project"
      hero_metric: "124M base params frozen, only 811K (0.65%) adapters trained -- 3MB adapter vs 500MB checkpoint"
      track: "ai"
    - name: "LangGraph ReAct Research Agent"
      url: "https://github.com/aymanapatel"
      hero_metric: "Autonomous tool-calling agent with dataflow integrity check that catches hallucinated outputs automatically"
      track: "ai"
    - name: "Technical Blog"
      url: "https://aymanace2049.hashnode.dev"
      hero_metric: "40+ articles on system design, microfrontends, eBPF, RAG, observability -- featured in eBPF newsletter"
      track: "fullstack"
    - name: "Engineering Whitepapers (Mastercard)"
      url: ""
      hero_metric: "Authored whitepapers on Accessibility + Microfrontend Architecture, circulated to 200+ engineers, CTO recognition"
      track: "backend"
  # Optional dashboard / live demo
  # dashboard:
  #   url: "https://ayman.example.dev/demo"
  #   password: "demo-2026"

compensation:
  # Default range = AI/ML range (typically higher in London market).
  # Switch to backend range as default if targeting backend-heavy roles.
  target_range: "GBP 80K-130K"
  currency: "GBP"
  minimum: "GBP 55K"
  location_flexibility: "London. Hybrid or full-time office; open to remote within UK"

  # alternate_ranges -- non-standard but the dual-track pattern needs it.
  # The evaluator should pick the range matching the detected archetype track.
  alternate_ranges:
    - track: "backend"
      target_range: "GBP 70K-120K"
      minimum: "GBP 55K"
      note: "Backend roles in London for 6+ year senior. Lower walk-away because visa sponsorship roles are the priority."
    - track: "ai"
      target_range: "GBP 80K-140K"
      minimum: "GBP 60K"
      note: "AI/ML engineering roles command a premium. Higher target reflects LLM/agent specialization."
    - track: "fullstack"
      target_range: "GBP 75K-125K"
      minimum: "GBP 55K"
      note: "Full-stack roles -- price between backend and AI tracks."
    - track: "mlops"
      target_range: "GBP 80K-135K"
      minimum: "GBP 60K"
      note: "ML Platform / MLOps roles -- premium for distributed training + Kubernetes + observability combo."

location:
  country: "United Kingdom"
  city: "London"
  timezone: "GMT/BST"
  visa_status: "Skilled Worker visa sponsorship needed (currently on Student visa for MSc)"
  onsite_availability: "London-based; hybrid preferred, open to full-time office"

cv:
  output_format: "latex" # "html" (default) or "latex"
